server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router client-side routing — any path that isn't a real static
    # file falls back to index.html so deep links (e.g. /events/{id}) work
    # on a hard refresh instead of 404ing at nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|jpg|jpeg|png|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server:
  port: ${PORT:8081}

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: event
    password: event
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

seatmap:
  cache:
    ttl-seconds: 45

logging:
  level:
    com.ticketbooking.event.cache: DEBUG

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

# Dev-only shared secret — must match the literal value in user-service,
# booking-service, and payment-service. See user-service/application.yml.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890

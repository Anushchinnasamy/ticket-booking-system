server:
  port: ${PORT:8082}

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: booking
    password: booking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: booking-service-ticketing
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.ticketbooking.common.event

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

event-service:
  base-url: http://localhost:8081

payment-service:
  base-url: http://localhost:8083

booking:
  hold-ttl-minutes: 5

# Dev-only shared secret — must match the literal value in user-service,
# event-service, and payment-service. See user-service/application.yml.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890

ticket:
  # Dev-only signing secret for QR payloads (HMAC-SHA256). Only booking-service
  # itself ever needs to know this — no other service verifies ticket QRs.
  qr-secret: dev-only-ticket-qr-signing-secret-do-not-use-in-prod-9876543210
  share-token-ttl-hours: 24
  storage:
    endpoint: http://localhost:9000
    access-key: ${MINIO_ACCESS_KEY:ticketbooking}
    secret-key: ${MINIO_SECRET_KEY:ticketbooking123}
    bucket: tickets

server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: booking
    password: booking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

event-service:
  base-url: http://localhost:8081

redis:
  host: localhost
  port: 6379

booking:
  hold-ttl-minutes: 5

# Dev-only shared secret — must match the literal value in user-service,
# event-service, and payment-service. See user-service/application.yml.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890

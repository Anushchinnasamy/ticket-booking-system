server:
  port: 8080

spring:
  application:
    name: api-gateway
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    gateway:
      # Dev-only: lets the Vite frontend (a different origin) call this
      # gateway from a real browser. Never exercised before now — every
      # prior verification hit these routes via curl/backend calls, which
      # aren't subject to CORS. Tighten/remove before any real deployment.
      globalcors:
        # Without this, CORS config only attaches to the GatewayFilterChain
        # (post-routing) — a preflight OPTIONS request doesn't match any
        # route below (they're all pinned to specific non-OPTIONS methods),
        # so it never reaches that chain and gets rejected with a bare 403
        # before the CORS headers are ever added. This registers CORS at the
        # handler-mapping level instead, so preflight is answered directly.
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_ORIGIN:http://localhost:5173}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD
            allowedHeaders: "*"
            allowCredentials: true
      # Every route below is deliberately scoped to only the paths and HTTP
      # methods that are genuinely customer/staff-facing (see each service's
      # SecurityConfig for which endpoints are marked "internal, service-to-
      # service only"). Internal endpoints (claim/release/book/lock,
      # confirm/cancel, payments/booking/{id}, users/{id}) have NO route here
      # on purpose — they're simply unreachable through the one public entry
      # point. Services still call each other directly, bypassing the
      # gateway, the way internal service-to-service traffic normally would
      # sit behind a private network in a real deployment.
      routes:
        # --- booking-service: seat reservation, the flash-sale hot path ---
        - id: booking-create
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=POST
            - Path=/bookings
          filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 5
                redis-rate-limiter.burstCapacity: 10
                redis-rate-limiter.requestedTokens: 1
                key-resolver: "#{@userKeyResolver}"

        - id: booking-get
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=GET
            - Path=/bookings/*

        - id: booking-ticket
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            # HEAD too — the frontend polls ticket readiness with a HEAD
            # request (see waitForTicketReady) before the real GET download.
            - Method=GET,HEAD
            - Path=/bookings/*/ticket

        - id: booking-share-create
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=POST
            - Path=/bookings/*/share

        - id: booking-share-view
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=GET
            - Path=/t/*

        - id: booking-ticket-combined
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=POST
            - Path=/bookings/tickets/combined

        - id: booking-share-combined-create
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=POST
            - Path=/bookings/tickets/combined/share

        - id: booking-share-combined-view
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=GET
            - Path=/t/group/*

        - id: booking-redeem
          uri: ${BOOKING_SERVICE_URL:http://localhost:8082}
          predicates:
            - Method=POST
            - Path=/tickets/redeem

        # --- event-service: catalog browsing + admin event creation ---
        - id: event-catalog
          uri: ${EVENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/events,/events/*

        - id: event-create
          uri: ${EVENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Method=POST
            - Path=/events

        - id: event-seat-map
          uri: ${EVENT_SERVICE_URL:http://localhost:8081}
          predicates:
            - Method=GET
            - Path=/shows/*/seats

        # --- user-service: everything under /auth is public by design ---
        - id: user-auth
          uri: ${USER_SERVICE_URL:http://localhost:8084}
          predicates:
            - Path=/auth/**

        # --- payment-service: charge + Razorpay checkout callbacks ---
        - id: payment-charge
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Method=POST
            - Path=/payments/charge

        - id: payment-get
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Method=GET
            - Path=/payments/*

        - id: payment-verify
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Method=POST
            - Path=/payments/*/verify

        - id: payment-fail
          uri: ${PAYMENT_SERVICE_URL:http://localhost:8083}
          predicates:
            - Method=POST
            - Path=/payments/*/fail

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

# Dev-only shared secret — must match the literal value in every other
# service. Used only to parse (not enforce) the JWT subject claim for
# rate-limit keying; downstream services remain the real authority on
# rejecting invalid tokens.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890

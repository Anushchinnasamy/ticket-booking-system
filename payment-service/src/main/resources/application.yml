server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

booking-service:
  base-url: http://localhost:8082

# Test-mode keys only — never commit real values here. Set via env vars
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET (Spring relaxed binding maps these
# to razorpay.key-id / razorpay.key-secret automatically).
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

server:
  port: 8082

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:postgresql://localhost:5432/booking_db
    username: booking
    password: booking
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

event-service:
  base-url: http://localhost:8081

redis:
  host: localhost
  port: 6379

booking:
  hold-ttl-minutes: 5

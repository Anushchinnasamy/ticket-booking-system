<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#0E0E10; font-family:'Inter', system-ui, -apple-system, sans-serif; color:#F5F5F7; }
    .navlink { font-size:14px; font-weight:500; color:#C9C9CE; }
    .tab { font-size:14px; font-weight:600; padding:11px 22px; border-radius:999px; }
    .tab.on { background:#E23744; color:#F5F5F7; }
    .tab.off { background:#1A1A1D; color:#9A9AA2; border:1px solid #262629; }
    .cta { background:#E23744; color:#F5F5F7; font-weight:700; font-size:14px; padding:14px 30px; border-radius:12px; cursor:pointer; box-shadow:0 10px 26px rgba(226,55,68,0.35); }
  </style>
</helmet>

<div style="width:1440px; min-height:1000px; background:#0E0E10; display:flex; flex-direction:column;">

  <div style="height:76px; display:flex; align-items:center; justify-content:space-between; padding:0 90px; border-bottom:1px solid #1E1E21;">
    <div style="display:flex; align-items:center; gap:44px;">
      <div style="display:flex; align-items:center; gap:8px;">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E23744" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M9 9l6 3-6 3z" fill="#E23744" stroke="none"/></svg>
        <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.02em;">ReelRow</div>
      </div>
      <div style="display:flex; align-items:center; gap:28px;">
        <div class="navlink">Movies</div>
        <div class="navlink">Events</div>
        <div class="navlink">Sports</div>
        <div class="navlink">Plays</div>
        <div class="navlink">Live</div>
      </div>
    </div>
    <div style="display:flex; align-items:center; gap:10px;">
      <div style="width:34px; height:34px; border-radius:999px; background:#E23744; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; font-weight:700; font-size:13px;">A</div>
      <div style="font-size:13.5px; font-weight:600;">Anush</div>
    </div>
  </div>

  <div style="padding:36px 90px 0 90px; display:flex; flex-direction:column; gap:26px; max-width:900px;">
    <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:26px; letter-spacing:-0.02em;">My Bookings</div>
    <div style="display:flex; gap:10px;">
      <div class="tab on">Upcoming (0)</div>
      <div class="tab off">Past (0)</div>
    </div>
  </div>

  <div style="flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:60px 0 120px 0;">
    <svg width="72" height="72" viewBox="0 0 24 24" fill="none" stroke="#3A3A3E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3 10a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v1.5a1.5 1.5 0 0 0 0 3V16a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1.5a1.5 1.5 0 0 0 0-3z"/>
      <path d="M9 8v10" stroke-dasharray="2.5 3"/>
    </svg>
    <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:19px;">No bookings yet</div>
    <div style="font-size:13.5px; color:#9A9AA2; text-align:center; max-width:320px;">Explore what's playing near you and book your first show in seconds.</div>
    <div class="cta">Explore Shows</div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

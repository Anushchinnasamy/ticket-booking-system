<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body { margin:0; background:#0E0E10; font-family:'Inter', system-ui, -apple-system, sans-serif; color:#F5F5F7; }
    .tab { font-size:13px; font-weight:600; padding:9px 18px; border-radius:999px; }
    .tab.on { background:#E23744; color:#F5F5F7; }
    .tab.off { background:#1A1A1D; color:#9A9AA2; border:1px solid #262629; }
    .bcard { background:#1A1A1D; border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; }
    .status-pill { display:inline-flex; align-items:center; gap:5px; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:999px; }
    .viewbtn { background:#232326; color:#F5F5F7; font-size:12.5px; font-weight:600; padding:10px; border-radius:9px; text-align:center; }
  </style>
</helmet>

<div style="width:390px; min-height:844px; background:#0E0E10; display:flex; flex-direction:column; position:relative;">

  <div style="display:flex; align-items:center; justify-content:space-between; padding:20px 20px 0 20px;">
    <div style="font-family:'Manrope',sans-serif; font-weight:800; font-size:19px; letter-spacing:-0.02em;">My Bookings</div>
    <div style="width:32px; height:32px; border-radius:999px; background:#E23744; display:flex; align-items:center; justify-content:center; font-family:'Manrope',sans-serif; font-weight:700; font-size:12px;">A</div>
  </div>

  <div style="display:flex; gap:8px; padding:20px 20px 0 20px;">
    <div class="tab on">Upcoming (2)</div>
    <div class="tab off">Past (5)</div>
  </div>

  <div style="display:flex; flex-direction:column; gap:14px; padding:18px 20px 100px 20px;">

    <div class="bcard">
      <div style="display:flex; gap:14px;">
        <img src="poster-1.jpg" alt="Midnight Frequency" style="width:64px; height:96px; border-radius:9px; object-fit:cover; flex-shrink:0;">
        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
          <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px; line-height:1.25;">Midnight Frequency</div>
          <span class="status-pill" style="background:#5A1218; color:#F5C518; align-self:flex-start;">TODAY &middot; 7:50 PM</span>
          <div style="font-size:11.5px; color:#9A9AA2;">PVR Forum Mall &middot; F6, F7, F8</div>
        </div>
      </div>
      <div class="viewbtn">View Ticket</div>
    </div>

    <div class="bcard">
      <div style="display:flex; gap:14px;">
        <img src="poster-6.jpg" alt="Analog Nights Tour" style="width:64px; height:96px; border-radius:9px; object-fit:cover; flex-shrink:0;">
        <div style="display:flex; flex-direction:column; gap:6px; flex:1;">
          <div style="font-family:'Manrope',sans-serif; font-weight:700; font-size:14.5px; line-height:1.25;">Analog Nights Tour</div>
          <span class="status-pill" style="background:rgba(46,204,113,0.15); color:#2ECC71; align-self:flex-start;">SAT, 22 AUG</span>
          <div style="font-size:11.5px; color:#9A9AA2;">Phoenix Arena &middot; 2 tickets</div>
        </div>
      </div>
      <div class="viewbtn">View Ticket</div>
    </div>

  </div>

  <div style="position:absolute; left:0; right:0; bottom:0; height:74px; background:#1A1A1D; border-top:1px solid #232326; display:flex; align-items:center; justify-content:space-around; padding-bottom:10px;">
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <div style="font-size:10px; font-weight:500; color:#9A9AA2;">Home</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <div style="font-size:10px; font-weight:500; color:#9A9AA2;">Search</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E23744" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v2a2 2 0 0 0 0 4v2a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-4z"/><path d="M13 6v2M13 16v2M13 11v2"/></svg>
      <div style="font-size:10px; font-weight:600; color:#E23744;">Bookings</div>
    </div>
    <div style="display:flex; flex-direction:column; align-items:center; gap:4px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#9A9AA2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
      <div style="font-size:10px; font-weight:500; color:#9A9AA2;">Profile</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>

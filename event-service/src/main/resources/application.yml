server:
  port: 8081

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/event_db
    username: event
    password: event
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never

# Dev-only shared secret — must match the literal value in user-service,
# booking-service, and payment-service. See user-service/application.yml.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890

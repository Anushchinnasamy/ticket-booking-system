server:
  port: 8083

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: payment
    password: payment
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoint:
    health:
      show-details: never
  endpoints:
    web:
      exposure:
        include: health,prometheus,circuitbreakers,circuitbreakerevents
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
    tags:
      application: ${spring.application.name}

booking-service:
  base-url: http://localhost:8082

resilience4j:
  circuitbreaker:
    instances:
      booking-service:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        # A 404 here means booking-service answered correctly that the
        # booking doesn't exist — a healthy response, not a sign it's down.
        # Only real connectivity/timeout failures should count toward
        # tripping the breaker.
        ignore-exceptions:
          - com.ticketbooking.common.exception.ResourceNotFoundException

# Test-mode keys only — never commit real values here. Set via env vars
# RAZORPAY_KEY_ID / RAZORPAY_KEY_SECRET (Spring relaxed binding maps these
# to razorpay.key-id / razorpay.key-secret automatically).
razorpay:
  key-id: ${RAZORPAY_KEY_ID:}
  key-secret: ${RAZORPAY_KEY_SECRET:}

# Dev-only shared secret — must match the literal value in user-service,
# event-service, and booking-service. See user-service/application.yml.
jwt:
  secret: dev-only-shared-jwt-signing-secret-do-not-use-in-prod-1234567890
